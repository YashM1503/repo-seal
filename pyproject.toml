[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchseal"
version = "1.0.0"
description = "Fail-closed checks for coding-agent benchmark-task evidence"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
authors = [{ name = "BenchSeal contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
]

[project.scripts]
benchseal = "benchseal.__main__:main"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP045"] # PEP 604 union syntax requires Python 3.10.

[tool.setuptools.packages.find]
where = ["src"]
