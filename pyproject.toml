[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-seal"
version = "1.1.0"
description = "Fail-closed checks for coding-agent benchmark-task evidence"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "RepoSeal contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
]

[project.scripts]
reposeal = "reposeal.__main__:main"
reposeal-mcp = "reposeal.mcp:main"

[project.urls]
Repository = "https://github.com/YashM1503/repo-seal"
Issues = "https://github.com/YashM1503/repo-seal/issues"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP045"] # PEP 604 union syntax requires Python 3.10.

[tool.setuptools.packages.find]
where = ["src"]
