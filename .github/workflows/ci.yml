name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run contract and replay tests
        run: python -m unittest discover -s tests -v

      - name: Check M0 fixtures
        run: python -m repolab_reference check-fixtures tests/fixtures/falsification

      - name: Run M1 controlled replay CLI
        run: python -m repolab_reference controlled-replay "$RUNNER_TEMP/repolab-controlled-replay"

      - name: Run M2a controlled mock-agent CLI
        run: python -m repolab_reference controlled-agent-replay "$RUNNER_TEMP/repolab-controlled-agent"

      - name: Run M2b isolation negative-control preflight
        run: python -m repolab_reference isolation-preflight "$RUNNER_TEMP/repolab-isolation-preflight"

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
