name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install BenchSeal
        run: python -m pip install .

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run contract and replay tests
        run: python -m unittest discover -s tests -v

      - name: Run BenchSeal MVP
        run: |
          benchseal --version
          benchseal validate examples/evidence.json --json
          benchseal validate examples/evidence-set --json

      - name: Check M0 fixtures
        run: python -m benchseal check-fixtures tests/fixtures/falsification

      - name: Run M1 controlled replay CLI
        run: python -m benchseal controlled-replay "$RUNNER_TEMP/benchseal-controlled-replay"

      - name: Run M2a controlled mock-agent CLI
        run: python -m benchseal controlled-agent-replay "$RUNNER_TEMP/benchseal-controlled-agent"

      - name: Run M2b isolation negative-control preflight
        run: python -m benchseal isolation-preflight "$RUNNER_TEMP/benchseal-isolation-preflight"

      - name: Check M2b Docker policy receipt
        run: python -m benchseal docker-isolation-plan "$RUNNER_TEMP/benchseal-docker-plan"

    env:
      PYTHONDONTWRITEBYTECODE: "1"

  docker-isolation:
    name: Docker isolation research
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install BenchSeal
        run: python -m pip install .

      - name: Build independent-review handoff
        run: python -m benchseal security-review-bundle . "$RUNNER_TEMP/benchseal-security-review"

      - name: Pull pinned M2b probe image
        run: docker pull "docker.io/library/python@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0"

      - name: Run live probe when the Engine satisfies policy
        env:
          BENCHSEAL_RUN_DOCKER_INTEGRATION: "1"
        run: python -W error::ResourceWarning -m unittest tests.test_docker_backend.DockerLiveIntegrationTests -v

    env:
      PYTHONDONTWRITEBYTECODE: "1"
