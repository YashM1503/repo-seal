name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Run contract and replay tests
        run: python -m unittest discover -s tests -v

      - name: Run BenchSeal MVP
        run: |
          python -m benchseal --version
          python -m benchseal validate examples/evidence.json --json
          python -m benchseal validate examples/evidence-set --json

      - name: Check M0 fixtures
        run: python -m repolab_reference check-fixtures tests/fixtures/falsification

      - name: Run M1 controlled replay CLI
        run: python -m repolab_reference controlled-replay "$RUNNER_TEMP/repolab-controlled-replay"

      - name: Run M2a controlled mock-agent CLI
        run: python -m repolab_reference controlled-agent-replay "$RUNNER_TEMP/repolab-controlled-agent"

      - name: Run M2b isolation negative-control preflight
        run: python -m repolab_reference isolation-preflight "$RUNNER_TEMP/repolab-isolation-preflight"

      - name: Check M2b Docker policy receipt
        run: python -m repolab_reference docker-isolation-plan "$RUNNER_TEMP/repolab-docker-plan"

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"

  docker-isolation:
    name: Hardened Docker isolation
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Build independent-review handoff
        run: python -m repolab_reference security-review-bundle . "$RUNNER_TEMP/repolab-security-review"

      - name: Pull pinned M2b probe image
        run: docker pull "docker.io/library/python@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0"

      - name: Run hardened M2b Docker isolation preflight
        env:
          REPOLAB_RUN_DOCKER_INTEGRATION: "1"
        run: |
          python -W error::ResourceWarning -m unittest tests.test_docker_backend.DockerLiveIntegrationTests -v
          python -m repolab_reference docker-isolation-preflight "$RUNNER_TEMP/repolab-docker-isolation"

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
